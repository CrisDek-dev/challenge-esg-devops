# Orquestracao da aplicacao: API (.NET 8) + SQL Server.
# Parametrizado por variaveis de ambiente, entao o MESMO arquivo serve para
# desenvolvimento local, staging e producao (veja .env.example e a pasta env/).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?defina SA_PASSWORD (copie .env.example para .env)}
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-energy-efficiency-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=EnergyEfficiencyDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY (copie .env.example para .env)}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - backend
    restart: unless-stopped

volumes:
  mssql-data:

networks:
  backend:
    driver: bridge
